<!doctype html>
<html lang="en" data-project="portfolio" data-density="comfortable" data-appearance-storage="doshi-preview-appearance" data-appearance-cookie="false">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#E7E4DE">
<title>Tailwind button comparison</title>
<script src="../dist/prepaint.js"></script>
<link rel="stylesheet" href="../dist/tokens.css"><link rel="stylesheet" href="../dist/components.css"><link rel="stylesheet" href="preview.css">
<style>
  .frames {display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px}
  .frames figure {margin:0; min-width:0}
  .frames figcaption {margin-bottom:8px; color:var(--ds-text-secondary); font-size:var(--ds-text-caption); font-weight:600}
  .frames iframe {display:block; width:100%; height:640px; border:0; border-radius:var(--ds-radius-container); box-shadow:var(--ds-shadow-raised)}
  @media(max-width:950px) {.frames {grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main" tabindex="-1">
<section class="hero"><h1>Button on Tailwind</h1><p class="lede">Release 0.10.0 draws the button with Tailwind CSS v4 and shadcn's structure on Base UI. Each row shows the 0.9 <code>.ds-button</code> next to the 0.10 <code>Button</code>; the two should look identical. Run <code>npm run preview</code> to rebuild the frames.</p></section>
<section class="controls" aria-label="Comparison settings">
<div class="control-field"><label for="density">Density</label><select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option><option value="game">Game, 60px targets</option></select></div>
</section>
<section class="frames" aria-label="Light and dark">
<figure><figcaption>Light</figcaption><iframe title="Buttons in light" data-theme-frame="light"></iframe></figure>
<figure><figcaption>Dark</figcaption><iframe title="Buttons in dark" data-theme-frame="dark"></iframe></figure>
</section>
</main><footer>Doshi design system <span>Release 0.10.0</span></footer>
<script>
  const frames = [...document.querySelectorAll('[data-theme-frame]')]
  const load = density => frames.forEach(frame => {frame.src = `tailwind-frame.html?theme=${frame.dataset.themeFrame}&density=${density}`})
  document.getElementById('density').addEventListener('change', event => {document.documentElement.dataset.density = event.target.value; load(event.target.value)})
  addEventListener('message', ({origin, data}) => {
    const frame = origin === location.origin && frames.find(item => item.dataset.themeFrame === data.frame)
    if (frame) frame.style.height = `${data.height}px`
  })
  load('comfortable')
</script>
</body>
</html>
